version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env:
      - name: STORAGE
        value: sqlite
      - name: NOTIFY
        value: log
      - name: AGENT_MODE
        value: rules
