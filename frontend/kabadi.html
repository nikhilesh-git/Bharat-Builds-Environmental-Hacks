<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कबाड़ी कनेक्ट (Kabadi Connect) — React Collector Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            },
            amberBrand: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.4/babel.min.js"></script>
</head>
<body class="min-h-full flex flex-col text-slate-800 font-devanagari antialiased bg-slate-100">
  <div id="root"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    const translations = {
      hi: {
        brand_title: "कबाड़ी कनेक्ट साथी",
        brand_tagline: "घर-घर से कबाड़ पिकअप करें • सही कमाई और लाइव बुकिंग",
        nav_household: "घर के लिए (Household)",
        nav_rates: "📊 बाज़ार भाव (Rates)",
        toggle_lang: "English में देखें",
        collector_name_label: "आपका नाम दर्ज करें (Collector Name):",
        stat_open: "उपलब्ध पिकअप",
        stat_accepted: "स्वीकृत",
        stat_live_sync: "🔴 लाइव सिंक (5s)",
        search_placeholder: "इलाका या ग्राहक का नाम खोजें...",
        filter_all: "सभी (All)",
        filter_high_value: "₹500+ अधिक मूल्य",
        filter_sample: "नमूना केवल",
        tab_open: "उपलब्ध अनुरोध (Open Requests)",
        tab_accepted: "मेरे स्वीकृत अनुरोध (Accepted)",
        badge_sample: "नमूना डेटा (Sample)",
        badge_accepted: "स्वीकृत (Accepted)",
        btn_accept: "पिकअप स्वीकार करें",
        btn_accepting: "स्वीकार हो रहा है...",
        no_open: "वर्तमान में कोई नया अनुरोध उपलब्ध नहीं है। 5 सेकंड में ऑटो-रिफ्रेश हो रहा है...",
        no_accepted: "आपने अभी तक कोई अनुरोध स्वीकार नहीं किया है।",
        toast_success: "पिकअप सफलतापूर्वक स्वीकार कर लिया गया!",
        rate_modal_title: "📈 दिल्ली-एनसीआर कबाड़ बाज़ार भाव (Live Rate Card)",
        close: "बंद करें",
        req_collector_name: "कृपया पहले अपना नाम दर्ज करें!"
      },
      en: {
        brand_title: "Kabadi Connect Partner",
        brand_tagline: "Doorstep Scrap Pickups • Guaranteed Earnings & Live Sync",
        nav_household: "Household Portal",
        nav_rates: "📊 Live Rates",
        toggle_lang: "हिंदी में देखें",
        collector_name_label: "Your Name (Collector Name):",
        stat_open: "Available",
        stat_accepted: "Accepted",
        stat_live_sync: "🔴 Live Sync (5s)",
        search_placeholder: "Search locality or customer name...",
        filter_all: "All",
        filter_high_value: "₹500+ High Value",
        filter_sample: "Sample Only",
        tab_open: "Open Requests",
        tab_accepted: "My Accepted Pickups",
        badge_sample: "Sample Data",
        badge_accepted: "Accepted",
        btn_accept: "Accept Pickup",
        btn_accepting: "Accepting...",
        no_open: "No open requests available right now. Auto-refreshing every 5s...",
        no_accepted: "You have not accepted any pickups yet.",
        toast_success: "Pickup accepted successfully!",
        rate_modal_title: "📈 Delhi-NCR Scrap Market Rates (Live Rate Card)",
        close: "Close",
        req_collector_name: "Please enter your collector name above first!"
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem("kabadi_lang") || "hi");
      const [collectorName, setCollectorName] = useState(() => localStorage.getItem("kabadi_collector_name") || "रमेश कुमार");
      const [requests, setRequests] = useState([]);
      const [activeTab, setActiveTab] = useState("open"); // "open" | "accepted"
      const [searchQuery, setSearchQuery] = useState("");
      const [filterCategory, setFilterCategory] = useState("all"); // "all" | "high_value" | "sample"
      const [toastMsg, setToastMsg] = useState(null);
      const [showRateModal, setShowRateModal] = useState(false);
      const [rateCardList, setRateCardList] = useState([]);
      const [acceptingId, setAcceptingId] = useState(null);

      const t = translations[lang] || translations.hi;

      const toggleLang = () => {
        const next = lang === "hi" ? "en" : "hi";
        setLang(next);
        localStorage.setItem("kabadi_lang", next);
      };

      const handleNameChange = (val) => {
        setCollectorName(val);
        localStorage.setItem("kabadi_collector_name", val);
      };

      // Fetch Requests from GET /requests
      const fetchRequests = useCallback(async () => {
        try {
          const res = await fetch("/requests");
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) setRequests(data);
          }
        } catch (e) {
          console.warn("Poll fetch error:", e);
        }
      }, []);

      useEffect(() => {
        fetchRequests();
        const timer = setInterval(fetchRequests, 5000);
        return () => clearInterval(timer);
      }, [fetchRequests]);

      // Accept Pickup
      const handleAccept = async (requestId) => {
        if (!collectorName.trim()) {
          alert(t.req_collector_name);
          return;
        }

        setAcceptingId(requestId);
        try {
          const res = await fetch(`/requests/${requestId}/accept`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ collector_name: collectorName.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message_hi || data.message_en || data.error);

          setToastMsg(t.toast_success);
          setTimeout(() => setToastMsg(null), 4000);
          await fetchRequests();
        } catch (err) {
          alert(err.message);
        } finally {
          setAcceptingId(null);
        }
      };

      // Open Rate Card Modal
      const openRates = async () => {
        setShowRateModal(true);
        try {
          const res = await fetch(`/rates?lang=${lang}`);
          const data = await res.json();
          if (data && data.rates) setRateCardList(data.rates);
        } catch (e) {
          console.error(e);
        }
      };

      // Filtered lists
      const openList = useMemo(() => {
        return requests.filter((r) => r.status !== "accepted");
      }, [requests]);

      const acceptedList = useMemo(() => {
        return requests.filter((r) => r.status === "accepted");
      }, [requests]);

      const displayList = useMemo(() => {
        let base = activeTab === "open" ? openList : acceptedList;

        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          base = base.filter((r) =>
            (r.locality && r.locality.toLowerCase().includes(q)) ||
            (r.name && r.name.toLowerCase().includes(q))
          );
        }

        if (filterCategory === "high_value") {
          base = base.filter((r) => (r.total_min || 0) >= 300);
        } else if (filterCategory === "sample") {
          base = base.filter((r) => r.is_sample);
        }

        return base;
      }, [activeTab, openList, acceptedList, searchQuery, filterCategory]);

      return (
        <div className="min-h-full flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-slate-900 border-b border-slate-800 text-white shadow-md">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
              <a href="/kabadi" className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-slate-900 font-extrabold text-xl shadow-md">
                  🚛
                </div>
                <div>
                  <h1 className="font-extrabold text-lg sm:text-xl text-white leading-tight flex items-center gap-2">
                    {t.brand_title}
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                      LIVE
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400 hidden sm:block">{t.brand_tagline}</p>
                </div>
              </a>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  type="button"
                  onClick={openRates}
                  className="touch-target inline-flex items-center px-3 py-2 text-xs sm:text-sm font-bold text-emerald-300 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition"
                >
                  {t.nav_rates}
                </button>

                <a
                  href="/household"
                  className="touch-target inline-flex items-center px-3 py-2 text-xs sm:text-sm font-bold text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition"
                >
                  🏠 <span className="ml-1 hidden sm:inline">{t.nav_household}</span>
                </a>

                <button
                  type="button"
                  onClick={toggleLang}
                  className="touch-target inline-flex items-center px-3.5 py-2 text-xs sm:text-sm font-extrabold text-slate-100 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition shadow-sm"
                >
                  🌐 {t.toggle_lang}
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
            {/* Identity & Stats Bar */}
            <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex-grow max-w-md">
                <label className="block text-sm font-extrabold text-slate-800 mb-1 flex items-center gap-1.5">
                  <span>👤</span> {t.collector_name_label}
                </label>
                <input
                  type="text"
                  value={collectorName}
                  onChange={(e) => handleNameChange(e.target.value)}
                  placeholder="उदा. रमेश कुमार / सुरेश कबाड़ी"
                  className="w-full rounded-xl border-2 border-slate-300 focus:border-brand-600 focus:ring-4 focus:ring-brand-100 p-3 text-slate-900 font-bold placeholder-slate-400 transition"
                />
              </div>

              <div className="flex items-center gap-4 sm:self-end">
                <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-center">
                  <span className="block text-xs font-semibold text-slate-500 uppercase">{t.stat_open}</span>
                  <span className="text-xl font-extrabold text-emerald-600">{openList.length}</span>
                </div>
                <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2 text-center">
                  <span className="block text-xs font-semibold text-slate-500 uppercase">{t.stat_accepted}</span>
                  <span className="text-xl font-extrabold text-slate-800">{acceptedList.length}</span>
                </div>
                <div className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                  <span>{t.stat_live_sync}</span>
                </div>
              </div>
            </div>

            {/* Toast Alert */}
            {toastMsg && (
              <div className="bg-emerald-600 text-white px-5 py-3.5 rounded-xl font-bold shadow-lg flex items-center justify-between transition-all">
                <span>{toastMsg}</span>
                <button onClick={() => setToastMsg(null)} className="text-white hover:text-emerald-200 font-bold ml-4">✕</button>
              </div>
            )}

            {/* Navigation Tabs & Search Filter */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setActiveTab("open")}
                  className={`px-4 py-2.5 rounded-xl font-extrabold text-sm transition ${
                    activeTab === "open"
                      ? "bg-brand-600 text-white shadow-sm"
                      : "bg-white text-slate-700 hover:bg-slate-200 border border-slate-300"
                  }`}
                >
                  📦 {t.tab_open} ({openList.length})
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab("accepted")}
                  className={`px-4 py-2.5 rounded-xl font-extrabold text-sm transition ${
                    activeTab === "accepted"
                      ? "bg-slate-900 text-white shadow-sm"
                      : "bg-white text-slate-700 hover:bg-slate-200 border border-slate-300"
                  }`}
                >
                  ✅ {t.tab_accepted} ({acceptedList.length})
                </button>
              </div>

              {/* Search Bar */}
              <div className="relative max-w-xs w-full">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder={t.search_placeholder}
                  className="w-full text-xs sm:text-sm pl-9 pr-3 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
                <span className="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
              </div>
            </div>

            {/* Filter Pills */}
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setFilterCategory("all")}
                className={`text-xs px-3 py-1.5 rounded-lg font-bold border transition ${
                  filterCategory === "all" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"
                }`}
              >
                {t.filter_all}
              </button>
              <button
                type="button"
                onClick={() => setFilterCategory("high_value")}
                className={`text-xs px-3 py-1.5 rounded-lg font-bold border transition ${
                  filterCategory === "high_value" ? "bg-emerald-700 text-white border-emerald-700" : "bg-white text-slate-600 border-slate-300"
                }`}
              >
                💰 {t.filter_high_value}
              </button>
              <button
                type="button"
                onClick={() => setFilterCategory("sample")}
                className={`text-xs px-3 py-1.5 rounded-lg font-bold border transition ${
                  filterCategory === "sample" ? "bg-amber-600 text-white border-amber-600" : "bg-white text-slate-600 border-slate-300"
                }`}
              >
                📊 {t.filter_sample}
              </button>
            </div>

            {/* Requests Grid */}
            {displayList.length === 0 ? (
              <div className="bg-white rounded-2xl p-10 border border-slate-200 text-center space-y-3">
                <div className="text-4xl">📭</div>
                <h3 className="text-base sm:text-lg font-bold text-slate-700">
                  {activeTab === "open" ? t.no_open : t.no_accepted}
                </h3>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {displayList.map((req) => {
                  const isAccepted = req.status === "accepted";
                  return (
                    <div
                      key={req.id}
                      className={`rounded-2xl border-2 p-5 flex flex-col justify-between space-y-4 shadow-sm transition hover:shadow-md ${
                        isAccepted ? "bg-emerald-50/40 border-emerald-300" : "bg-white border-slate-200 hover:border-brand-500"
                      }`}
                    >
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <h3 className="text-lg font-extrabold text-slate-900 flex items-center gap-1.5">
                            <span>📍</span> {req.locality}
                          </h3>
                          {req.is_sample && (
                            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold bg-amberBrand-100 text-amberBrand-800 border border-amberBrand-300">
                              📊 {t.badge_sample}
                            </span>
                          )}
                          {isAccepted && (
                            <span className="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-300">
                              ✓ {t.badge_accepted}
                            </span>
                          )}
                        </div>

                        <div className="flex flex-wrap items-center gap-2 text-xs font-semibold text-slate-500 mb-3">
                          <span className="inline-flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md text-slate-700">
                            ⏰ {req.slot}
                          </span>
                          <span className="inline-flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-md text-slate-700">
                            👤 {req.name}
                          </span>
                        </div>

                        {/* Items Breakdown Pills */}
                        <div className="flex flex-wrap gap-1.5 mb-3">
                          {(req.items || []).map((it, i) => (
                            <span
                              key={i}
                              className="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200"
                            >
                              {it.material || it.name} ({it.quantity || "1 kg"})
                            </span>
                          ))}
                        </div>

                        {isAccepted && (
                          <div className="text-xs font-bold text-emerald-800 bg-white p-2 rounded-lg border border-emerald-200">
                            🛵 साथी: {req.collector_name || collectorName}
                          </div>
                        )}
                      </div>

                      <div className="pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
                        <div>
                          <span className="block text-[11px] font-bold uppercase text-slate-400">अनुमानित भुगतान</span>
                          <span className="text-xl font-extrabold text-emerald-700">
                            ₹{req.total_min} - ₹{req.total_max}
                          </span>
                        </div>

                        {!isAccepted && (
                          <button
                            type="button"
                            onClick={() => handleAccept(req.id)}
                            disabled={acceptingId === req.id}
                            className="touch-target px-5 py-3 rounded-xl font-extrabold text-sm sm:text-base text-white bg-brand-600 hover:bg-brand-700 active:bg-brand-800 shadow transition flex items-center justify-center disabled:opacity-50"
                          >
                            {acceptingId === req.id ? t.btn_accepting : t.btn_accept}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* Modal: Live Scrap Rate Card */}
          {showRateModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">{t.rate_modal_title}</h3>
                  <button onClick={() => setShowRateModal(false)} className="text-slate-400 hover:text-slate-700 text-xl font-bold">✕</button>
                </div>

                <div className="divide-y divide-slate-100">
                  {rateCardList.map((r, i) => (
                    <div key={i} className="py-2.5 flex items-center justify-between">
                      <span className="font-semibold text-slate-800">{r.name}</span>
                      <span className="font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full text-xs border border-emerald-200">
                        {r.rate_display}
                      </span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowRateModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition"
                >
                  {t.close}
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-6">
            <div className="max-w-5xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-3">
              <span>© 2026 कबाड़ी कनेक्ट (Kabadi Connect) • AWS Hackathon — Waste & Energy Track</span>
              <div className="flex items-center gap-4">
                <a href="/household" className="font-semibold text-slate-700">घर के लिए</a>
                <a href="/kabadi" className="font-semibold text-slate-700">कबाड़ीवाला पोर्टल</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
