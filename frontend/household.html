  <title>कबाड़ी कनेक्ट (Kabadi Connect) — React Household Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',

            amberBrand: {

              100: '#fef3c7',

              600: '#d97706',
              700: '#b45309'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="/static/style.css">

  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

</head>
<body class="min-h-full flex flex-col text-slate-800 font-devanagari antialiased bg-slate-50">
  <div id="root"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Translations Dictionary
    const translations = {
      hi: {
        brand_title: "कबाड़ी कनेक्ट",
        brand_tagline: "घर बैठे कबाड़ बेचें • सही दाम और तुरंत पिकअप",
        nav_kabadi: "कबाड़ीवाला पोर्टल",
        nav_rates: "📊 बाज़ार भाव (Rates)",
        toggle_lang: "English में देखें",
        hero_tag: "⚡ Waste & Energy Track — AWS Hackathon (AI Agent)",
        hero_title: "घर का कबाड़ बेचें, तुरंत सही दाम जानें",
        hero_subtitle: "अखबार, गत्ता, लोहा, प्लास्टिक या ई-कचरा — कुछ भी लिखिए या बोलिए। AI तुरंत अनुमानित कीमत बताएगा।",
        step1_title: "1. कबाड़ का विवरण दें",
        placeholder_input: "उदाहरण: 10 किलो अखबार, 5 किलो गत्ता, एक पुरानी लोहे की कुर्सी, 10 पानी की बोतलें...",
        mic_listening: "🎙️ सुन रहे हैं... बोलिए",
        mic_btn_title: "बोलकर दर्ज करें (Speech-to-Text)",
        chips_label: "त्वरित उदाहरण (क्लिक करें):",
        btn_estimate: "कीमत का अनुमान लगाएं",
        btn_estimating: "AI मूल्यांकन कर रहा है...",
        estimate_heading: "अनुमानित दर और कुल मूल्य",
        table_material: "सामग्री (Item)",
        table_qty: "मात्रा (Quantity)",
        table_rate: "अनुमानित दर (Rate)",
        table_price: "अनुमानित मूल्य (Value)",
        badge_assumed: "अनुमानित",
        assumed_tooltip: "इस आइटम की मात्रा/वजन का AI द्वारा अंदाज़ा लगाया गया है",
        total_payout_label: "कुल अनुमानित भुगतान:",
        approx_note: "* सभी दरें अनुमानित हैं। डिजिटल तराजू से सत्यापन होगा।",
        eco_title: "🌍 आपका पर्यावरण योगदान (Carbon Impact)",
        eco_trees: "पेड़ बचाए",
        eco_water: "लीटर पानी बचाया",
        eco_co2: "किलो CO₂ रोका",
        eco_landfill: "किलो कचरा डंप होने से बचा",
        step2_title: "2. पिकअप का समय और पता चुनें",
        label_name: "आपका नाम",
        label_locality: "इलाका / पता",
        label_slot: "पिकअप का समय",
        quick_localities: ["लाजपत नगर IV", "मालवीय नगर", "साकेत", "रोहिणी सेक्टर 7"],
        btn_book: "कबाड़ीवाला बुलाएं (Book Pickup)",
        btn_booking: "अनुरोध दर्ज हो रहा है...",
        status_heading: "अनुरोध की स्थिति (Live Status)",
        status_waiting_title: "कबाड़ीवाले की प्रतीक्षा में...",
        status_waiting_desc: "आपका अनुरोध पास के कबाड़ीवालों को प्रसारित कर दिया गया है। जैसे ही कोई स्वीकार करेगा, अपडेट दिखेगा।",
        status_accepted_title: "🎉 कबाड़ीवाला आ रहा है!",
        status_accepted_msg: "{collector} {slot} पर आपके पते पर आ रहे हैं।",
        btn_new_request: "नया अनुरोध बनाएं",
        rate_modal_title: "📈 दिल्ली-एनसीआर कबाड़ बाज़ार भाव (Live Rate Card)",
        close: "बंद करें",
        err_empty_input: "कृपया कबाड़ का विवरण लिखें या बोलें।"
      },
      en: {
        brand_title: "Kabadi Connect",
        brand_tagline: "Doorstep Scrap Selling • Fair Rates & Fast Pickup",
        nav_kabadi: "Collector Portal",
        nav_rates: "📊 Live Rates",
        toggle_lang: "हिंदी में देखें",
        hero_tag: "⚡ Waste & Energy Track — AWS Hackathon (AI Agent)",
        hero_title: "Sell Household Scrap at Fair Market Rates",
        hero_subtitle: "Newspaper, cardboard, iron, plastics or e-waste — type or speak. AI estimates prices instantly.",
        step1_title: "1. Describe Your Scrap",
        placeholder_input: "e.g., 10 kg newspaper, 5 kg cardboard, old iron chair, 10 plastic bottles...",
        mic_listening: "🎙️ Listening... Speak now",
        mic_btn_title: "Voice Input (Speech-to-Text)",
        chips_label: "Quick Examples (click to autofill):",
        btn_estimate: "Get Price Estimate",
        btn_estimating: "AI is estimating...",
        estimate_heading: "Estimated Rates & Value",
        table_material: "Material / Item",
        table_qty: "Quantity",
        table_rate: "Est. Rate",
        table_price: "Est. Value",
        badge_assumed: "Assumed",
        assumed_tooltip: "Weight/quantity approximated by AI agent",
        total_payout_label: "Total Estimated Payout:",
        approx_note: "* All rates approximate. Final weight verified on digital scale.",
        eco_title: "🌍 Your Environmental Impact",
        eco_trees: "Trees Saved",
        eco_water: "Litres Water Saved",
        eco_co2: "kg CO₂ Averted",
        eco_landfill: "kg Landfill Diverted",
        step2_title: "2. Select Pickup Slot & Address",
        label_name: "Your Name",
        label_locality: "Locality / Address",
        label_slot: "Preferred Time Slot",
        quick_localities: ["Lajpat Nagar IV", "Malviya Nagar", "Saket", "Rohini Sector 7"],
        btn_book: "Book Pickup Request",
        btn_booking: "Booking Pickup...",
        status_heading: "Pickup Request Live Status",
        status_waiting_title: "Waiting for a kabadiwala...",
        status_waiting_desc: "Your request is broadcast to nearby verified collectors. Updates appear here in real-time.",
        status_accepted_title: "🎉 Kabadiwala Confirmed!",
        status_accepted_msg: "{collector} is coming at {slot}.",
        btn_new_request: "Create Another Request",
        rate_modal_title: "📈 Delhi-NCR Scrap Market Rates (Live Rate Card)",
        close: "Close",
        err_empty_input: "Please describe your scrap items first."
      }
    };

    function App() {
      const [lang, setLang] = useState(() => localStorage.getItem("kabadi_lang") || "hi");
      const [scrapText, setScrapText] = useState("");
      const [isListening, setIsListening] = useState(false);
      const [isEstimating, setIsEstimating] = useState(false);
      const [estimateData, setEstimateData] = useState(null);
      const [carbonImpact, setCarbonImpact] = useState(null);

      // Booking Form State
      const [name, setName] = useState("सुनीता शर्मा");
      const [locality, setLocality] = useState("लाजपत नगर IV, दिल्ली");
      const [slot, setSlot] = useState("कल सुबह (10:00 AM - 12:00 PM)");
      const [isBooking, setIsBooking] = useState(false);

      // Active Request & Polling State
      const [activeRequestId, setActiveRequestId] = useState(() => localStorage.getItem("kabadi_active_req_id") || null);
      const [requestDetails, setRequestDetails] = useState(null);

      // Modals & Errors
      const [showRateModal, setShowRateModal] = useState(false);
      const [rateCardList, setRateCardList] = useState([]);
      const [errorMsg, setErrorMsg] = useState(null);

      const t = translations[lang] || translations.hi;

      // Toggle Language
      const toggleLang = () => {
        const next = lang === "hi" ? "en" : "hi";
        setLang(next);
        localStorage.setItem("kabadi_lang", next);
      };

      // Speech Recognition Handler
      const recognitionRef = useRef(null);
      useEffect(() => {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          const rec = new SpeechRec();
          rec.continuous = false;
          rec.interimResults = true;
          rec.onstart = () => setIsListening(true);
          rec.onresult = (e) => {
            let transcript = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
              transcript += e.results[i][0].transcript;
            }
            setScrapText((prev) => (prev ? prev + " " + transcript : transcript));
          };
          rec.onerror = () => setIsListening(false);
          rec.onend = () => setIsListening(false);
          recognitionRef.current = rec;
        }
      }, []);

      const toggleMic = () => {
        if (!recognitionRef.current) {
          alert("Speech recognition not supported in this browser.");
          return;
        }
        if (isListening) {
          recognitionRef.current.stop();
        } else {
          recognitionRef.current.lang = lang === "hi" ? "hi-IN" : "en-IN";
          try {
            recognitionRef.current.start();
          } catch (e) {
            console.warn(e);
          }
        }
      };

      // Load Rates for Modal
      const openRates = async () => {
        setShowRateModal(true);
        try {
          const res = await fetch(`/rates?lang=${lang}`);
          const data = await res.json();
          if (data && data.rates) {
            setRateCardList(data.rates);
          }
        } catch (e) {
          console.error(e);
        }
      };

      // Step 1: Handle Estimate
      const handleEstimate = async () => {
        setErrorMsg(null);
        if (!scrapText.trim()) {
          setErrorMsg(t.err_empty_input);
          return;
        }

        setIsEstimating(true);
        try {
          const res = await fetch("/estimate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: scrapText.trim(), lang })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message_hi || data.message_en || data.error);

          setEstimateData(data);

          // Calculate Environmental Carbon Impact
          try {
            const cRes = await fetch("/carbon-impact", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ items: data.items || [] })
            });
            const cData = await cRes.json();
            if (cRes.ok) setCarbonImpact(cData);
          } catch (cErr) {
            console.warn("Carbon impact failed:", cErr);
          }
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setIsEstimating(false);
        }
      };

      // Step 2: Handle Booking
      const handleBookPickup = async () => {
        setErrorMsg(null);
        if (!name.trim() || !locality.trim()) {
          setErrorMsg(lang === "hi" ? "कृपया नाम और इलाका अवश्य भरें।" : "Please enter both Name and Locality.");
          return;
        }
        if (!estimateData || !estimateData.items) return;

        setIsBooking(true);
        try {
          const payload = {
            name: name.trim(),
            locality: locality.trim(),
            slot: slot,
            items: estimateData.items,
            total_min: estimateData.total_min || 0,
            total_max: estimateData.total_max || 0,
            original_text: scrapText.trim(),
            lang: lang
          };

          const res = await fetch("/requests", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const created = await res.json();
          if (!res.ok) throw new Error(created.message_hi || created.message_en || created.error);

          setActiveRequestId(created.id);
          setRequestDetails(created);
          localStorage.setItem("kabadi_active_req_id", created.id);
        } catch (err) {
          setErrorMsg(err.message);
        } finally {
          setIsBooking(false);
        }
      };

      // Step 3: Polling GET /requests/{id} every 5 seconds
      const pollStatus = useCallback(async (id) => {
        try {
          const res = await fetch(`/requests/${id}`);
          if (res.ok) {
            const data = await res.json();
            setRequestDetails(data);
          }
        } catch (err) {
          console.warn("Polling error:", err);
        }
      }, []);

      useEffect(() => {
        if (!activeRequestId) return;
        pollStatus(activeRequestId);
        const timer = setInterval(() => pollStatus(activeRequestId), 5000);
        return () => clearInterval(timer);
      }, [activeRequestId, pollStatus]);

      // Reset to create another request
      const handleReset = () => {
        localStorage.removeItem("kabadi_active_req_id");
        setActiveRequestId(null);
        setRequestDetails(null);
        setEstimateData(null);
        setCarbonImpact(null);
        setScrapText("");
      };

      return (
        <div className="min-h-full flex flex-col">
          {/* Header */}
          <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
              <a href="/household" className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white text-xl shadow-md">
                  ♻️
                </div>
                <div>
                  <h1 className="font-extrabold text-xl text-slate-900 leading-tight">{t.brand_title}</h1>
                  <p className="text-xs text-slate-500 hidden sm:block">{t.brand_tagline}</p>
                </div>
              </a>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  type="button"
                  onClick={openRates}
                  className="touch-target inline-flex items-center px-3 py-2 text-xs sm:text-sm font-bold text-emerald-800 bg-emerald-50 hover:bg-emerald-100 rounded-lg border border-emerald-300 transition"
                >
                  {t.nav_rates}
                </button>

                <a
                  href="/kabadi"
                  className="touch-target inline-flex items-center px-3 py-2 text-xs sm:text-sm font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg border border-slate-300 transition"
                >
                  🚛 <span className="ml-1 hidden sm:inline">{t.nav_kabadi}</span>
                </a>

                <button
                  type="button"
                  onClick={toggleLang}
                  className="touch-target inline-flex items-center px-3.5 py-2 text-xs sm:text-sm font-extrabold text-slate-800 bg-amberBrand-50 hover:bg-amberBrand-100 rounded-lg border border-amberBrand-500/30 transition shadow-sm"
                >
                  🌐 {t.toggle_lang}
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">
            {/* Hero Card */}
            <div className="bg-gradient-to-r from-brand-900 via-brand-800 to-emerald-950 rounded-2xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden">
              <div className="relative z-10 max-w-2xl">
                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30 mb-3">
                  {t.hero_tag}
                </span>
                <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">{t.hero_title}</h2>
                <p className="mt-2 text-sm sm:text-base text-emerald-100/90 leading-relaxed">{t.hero_subtitle}</p>
              </div>
            </div>

            {/* Error Banner */}
            {errorMsg && (
              <div className="bg-red-50 border-l-4 border-red-500 p-4 rounded-xl flex items-start justify-between shadow-sm">
                <div className="flex items-center gap-2">
                  <span className="text-xl">⚠️</span>
                  <span className="text-sm font-bold text-red-800">{errorMsg}</span>
                </div>
                <button onClick={() => setErrorMsg(null)} className="text-red-500 font-bold ml-2">✕</button>
              </div>
            )}

            {/* Step 1 & 2: Scrap Input & Booking (Shown when NOT in live polling mode) */}
            {!activeRequestId && (
              <>
                {/* STEP 1: Input */}
                <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-lg sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                      <span className="w-7 h-7 rounded-full bg-brand-600 text-white inline-flex items-center justify-center text-sm font-bold">1</span>
                      {t.step1_title}
                    </h3>
                    {isListening && (
                      <span className="text-xs font-bold text-red-600 animate-pulse flex items-center gap-1">
                        <span className="w-2.5 h-2.5 rounded-full bg-red-600"></span>
                        {t.mic_listening}
                      </span>
                    )}
                  </div>

                  <div className="relative">
                    <textarea
                      rows="4"
                      value={scrapText}
                      onChange={(e) => setScrapText(e.target.value)}
                      placeholder={t.placeholder_input}
                      className="w-full rounded-xl border-2 border-slate-300 focus:border-brand-600 focus:ring-4 focus:ring-brand-100 p-4 text-base text-slate-800 placeholder-slate-400 transition resize-y min-h-[120px]"
                    />
                    <button
                      type="button"
                      onClick={toggleMic}
                      title={t.mic_btn_title}
                      className={`touch-target absolute right-3 bottom-3 p-3 rounded-full border shadow-sm transition active:scale-95 flex items-center justify-center ${
                        isListening ? "bg-red-500 text-white border-red-600 animate-bounce" : "bg-slate-100 text-slate-700 hover:bg-brand-50 hover:text-brand-700 border-slate-300"
                      }`}
                    >
                      <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                      </svg>
                    </button>
                  </div>

                  {/* Suggestion Chips */}
                  <div>
                    <span className="text-xs font-semibold text-slate-500 block mb-2">{t.chips_label}</span>
                    <div className="flex flex-wrap gap-2">
                      {[
                        "10 किलो अखबार, 5 किलो गत्ता, एक पुरानी लोहे की कुर्सी",
                        "पुराना कूलर, लोहे की जाली, 8 बीयर की बोतलें",
                        "15 प्लास्टिक की बोतलें, टूटा पंखा, 2 kg तांबे का तार",
                        "20 kg books, 4 plastic buckets, broken cooler"
                      ].map((chip, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => setScrapText(chip)}
                          className="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-brand-50 hover:text-brand-800 border border-slate-200 rounded-lg text-slate-700 transition"
                        >
                          {chip}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={handleEstimate}
                    disabled={isEstimating}
                    className="touch-target w-full flex items-center justify-center px-6 py-3.5 rounded-xl font-extrabold text-base sm:text-lg text-white bg-brand-600 hover:bg-brand-700 active:bg-brand-800 shadow-md hover:shadow-lg transition disabled:opacity-50"
                  >
                    {isEstimating ? t.btn_estimating : t.btn_estimate}
                  </button>
                </section>

                {/* Estimate Result & Booking Form */}
                {estimateData && (
                  <section className="bg-white rounded-2xl border-2 border-emerald-500 shadow-lg p-5 sm:p-7 space-y-6">
                    <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                      <div>
                        <h3 className="text-lg sm:text-xl font-extrabold text-slate-900">{t.estimate_heading}</h3>
                        <p className="text-xs text-slate-500 mt-0.5">{t.approx_note}</p>
                      </div>
                      <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-brand-100 text-brand-800">
                        ✓ AI Valued
                      </span>
                    </div>

                    {/* Table */}
                    <div className="overflow-x-auto rounded-xl border border-slate-200">
                      <table className="w-full text-left text-sm text-slate-700 divide-y divide-slate-200">
                        <thead className="bg-slate-100 text-xs font-bold text-slate-600 uppercase">
                          <tr>
                            <th className="px-4 py-3">{t.table_material}</th>
                            <th className="px-4 py-3">{t.table_qty}</th>
                            <th className="px-4 py-3">{t.table_rate}</th>
                            <th className="px-4 py-3 text-right">{t.table_price}</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 bg-white">
                          {(estimateData.items || []).map((item, idx) => {
                            const isAssumed = item.assumed ?? item.is_assumed ?? false;
                            const minP = item.min_price ?? item.price_min ?? 0;
                            const maxP = item.max_price ?? item.price_max ?? 0;
                            return (
                              <tr key={idx} className="hover:bg-slate-50 transition">
                                <td className="px-4 py-3 font-semibold text-slate-800 flex items-center">
                                  {item.material || item.name}
                                  {isAssumed && (
                                    <span
                                      className="inline-flex items-center ml-2 px-2 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300"
                                      title={t.assumed_tooltip}
                                    >
                                      {t.badge_assumed}
                                    </span>
                                  )}
                                </td>
                                <td className="px-4 py-3 font-medium text-slate-600">{item.quantity}</td>
                                <td className="px-4 py-3 text-slate-600 font-mono text-xs">{item.rate_per_kg}</td>
                                <td className="px-4 py-3 text-right font-bold text-emerald-700 font-mono">
                                  ₹{minP} - ₹{maxP}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>

                    {/* Total Payout */}
                    <div className="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-300 rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-inner">
                      <div>
                        <span className="text-xs font-bold uppercase tracking-wider text-emerald-800">{t.total_payout_label}</span>
                        <p className="text-xs text-emerald-600 mt-0.5">नकद / UPI द्वारा आपके दरवाजे पर भुगतान किया जाएगा</p>
                      </div>
                      <div className="text-3xl sm:text-4xl font-extrabold text-emerald-700 tracking-tight">
                        ₹{estimateData.total_min} - ₹{estimateData.total_max}
                      </div>
                    </div>

                    {/* Additional Feature: Carbon & Eco-Impact Calculator */}
                    {carbonImpact && (
                      <div className="bg-slate-900 text-white rounded-xl p-5 border border-slate-800 shadow-md">
                        <h4 className="text-sm font-extrabold text-emerald-400 mb-3 flex items-center gap-2">
                          <span>🌱</span> {t.eco_title}
                        </h4>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                          <div className="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                            <span className="text-xl sm:text-2xl font-extrabold text-emerald-400">{carbonImpact.trees_saved}</span>
                            <span className="block text-[11px] text-slate-300 mt-1">{t.eco_trees}</span>
                          </div>
                          <div className="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                            <span className="text-xl sm:text-2xl font-extrabold text-cyan-400">{carbonImpact.water_saved_litres} L</span>
                            <span className="block text-[11px] text-slate-300 mt-1">{t.eco_water}</span>
                          </div>
                          <div className="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                            <span className="text-xl sm:text-2xl font-extrabold text-amber-400">{carbonImpact.co2_saved_kg} kg</span>
                            <span className="block text-[11px] text-slate-300 mt-1">{t.eco_co2}</span>
                          </div>
                          <div className="bg-slate-800/80 p-3 rounded-lg border border-slate-700">
                            <span className="text-xl sm:text-2xl font-extrabold text-purple-400">{carbonImpact.landfill_diverted_kg} kg</span>
                            <span className="block text-[11px] text-slate-300 mt-1">{t.eco_landfill}</span>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* STEP 2: Booking Form */}
                    <div className="border-t border-slate-200 pt-6 space-y-4">
                      <h4 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <span className="w-7 h-7 rounded-full bg-brand-600 text-white inline-flex items-center justify-center text-sm font-bold">2</span>
                        {t.step2_title}
                      </h4>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-bold text-slate-700 mb-1">{t.label_name}</label>
                          <input
                            type="text"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            className="w-full rounded-xl border-2 border-slate-300 focus:border-brand-600 focus:ring-4 focus:ring-brand-100 p-3 text-slate-800 font-medium"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-bold text-slate-700 mb-1">{t.label_locality}</label>
                          <input
                            type="text"
                            value={locality}
                            onChange={(e) => setLocality(e.target.value)}
                            className="w-full rounded-xl border-2 border-slate-300 focus:border-brand-600 focus:ring-4 focus:ring-brand-100 p-3 text-slate-800 font-medium"
                          />
                        </div>
                      </div>

                      {/* Locality Quick Pills */}
                      <div className="flex flex-wrap gap-2 pt-1">
                        {t.quick_localities.map((loc, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => setLocality(loc + ", दिल्ली")}
                            className="text-xs px-2.5 py-1 rounded-md bg-slate-100 hover:bg-emerald-50 text-slate-700 border border-slate-200 font-semibold transition"
                          >
                            📍 {loc}
                          </button>
                        ))}
                      </div>

                      {/* Time Slot */}
                      <div>
                        <label className="block text-sm font-bold text-slate-700 mb-1">{t.label_slot}</label>
                        <select
                          value={slot}
                          onChange={(e) => setSlot(e.target.value)}
                          className="w-full rounded-xl border-2 border-slate-300 focus:border-brand-600 focus:ring-4 focus:ring-brand-100 p-3 text-slate-800 font-medium bg-white"
                        >
                          <option value="कल सुबह (10:00 AM - 12:00 PM)">कल सुबह (10:00 AM - 12:00 PM)</option>
                          <option value="कल दोपहर (2:00 PM - 4:00 PM)">कल दोपहर (2:00 PM - 4:00 PM)</option>
                          <option value="आज दोपहर (2:00 PM - 4:00 PM)">आज दोपहर (2:00 PM - 4:00 PM)</option>
                          <option value="आज शाम (4:00 PM - 6:00 PM)">आज शाम (4:00 PM - 6:00 PM)</option>
                        </select>
                      </div>

                      <button
                        type="button"
                        onClick={handleBookPickup}
                        disabled={isBooking}
                        className="touch-target w-full flex items-center justify-center px-6 py-4 rounded-xl font-extrabold text-base sm:text-lg text-white bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 shadow-md hover:shadow-lg transition disabled:opacity-50"
                      >
                        {isBooking ? t.btn_booking : t.btn_book}
                      </button>
                    </div>
                  </section>
                )}
              </>
            )}

            {/* STEP 3: Live Status Card (Polling GET /requests/{id} every 5s) */}
            {activeRequestId && requestDetails && (
              <section className="bg-white rounded-2xl border-2 border-slate-200 shadow-lg p-5 sm:p-7 space-y-6">
                <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                  <h3 className="text-lg sm:text-xl font-extrabold text-slate-900">{t.status_heading}</h3>
                  <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amberBrand-50 text-amberBrand-700 border border-amberBrand-500/20">
                    🔴 लाइव सिंक (5s Polling)
                  </span>
                </div>

                {/* State: Pending vs Accepted */}
                {requestDetails.status === "accepted" ? (
                  <div className="bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-6 text-center space-y-4 shadow-sm">
                    <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 text-4xl mb-2">
                      🎉
                    </div>
                    <h4 className="text-2xl font-extrabold text-emerald-900">{t.status_accepted_title}</h4>
                    <div className="p-4 bg-white rounded-xl border border-emerald-200 max-w-lg mx-auto shadow-sm">
                      <p className="text-lg font-bold text-emerald-800">
                        🛵 {requestDetails.collector_name || "रमेश कुमार"} {requestDetails.slot} पर आपके पते पर आ रहे हैं।
                      </p>
                    </div>
                  </div>
                ) : (
                  <div className="bg-amber-50/80 border-2 border-amber-300 rounded-2xl p-6 text-center space-y-4">
                    <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-amber-100 text-amber-600 radar-pulse mb-2 text-3xl">
                      ⏳
                    </div>
                    <h4 className="text-2xl font-extrabold text-amber-900">{t.status_waiting_title}</h4>
                    <p className="text-sm text-amber-800 max-w-md mx-auto">{t.status_waiting_desc}</p>
                  </div>
                )}

                {/* Request Details */}
                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 text-sm space-y-2">
                  <div className="flex justify-between py-1 border-b border-slate-200">
                    <span className="text-slate-500 font-medium">अनुरोध आईडी:</span>
                    <span className="font-mono font-bold text-slate-800">{requestDetails.id}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-200">
                    <span className="text-slate-500 font-medium">ग्राहक:</span>
                    <span className="font-bold text-slate-800">{requestDetails.name}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-200">
                    <span className="text-slate-500 font-medium">स्थान:</span>
                    <span className="font-bold text-slate-800">{requestDetails.locality}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-200">
                    <span className="text-slate-500 font-medium">समय स्लॉट:</span>
                    <span className="font-bold text-slate-800">{requestDetails.slot}</span>
                  </div>
                  <div className="flex justify-between py-1">
                    <span className="text-slate-500 font-medium">अनुमानित भुगतान:</span>
                    <span className="font-extrabold text-emerald-700 text-base">₹{requestDetails.total_min} - ₹{requestDetails.total_max}</span>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={handleReset}
                  className="touch-target w-full py-3 px-4 rounded-xl font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 transition"
                >
                  {t.btn_new_request}
                </button>
              </section>
            )}
          </main>

          {/* Modal: Live Scrap Rate Card */}
          {showRateModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6 shadow-2xl border border-slate-200 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">{t.rate_modal_title}</h3>
                  <button onClick={() => setShowRateModal(false)} className="text-slate-400 hover:text-slate-700 text-xl font-bold">✕</button>
                </div>

                <div className="divide-y divide-slate-100">
                  {rateCardList.map((r, i) => (
                    <div key={i} className="py-2.5 flex items-center justify-between">
                      <span className="font-semibold text-slate-800">{r.name}</span>
                      <span className="font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full text-xs border border-emerald-200">
                        {r.rate_display}
                      </span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => setShowRateModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition"
                >
                  {t.close}
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-slate-200 bg-white py-6">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-3">
              <span>© 2026 कबाड़ी कनेक्ट (Kabadi Connect) • AWS Hackathon — Waste & Energy Track</span>
              <div className="flex items-center gap-4">
                <a href="/household" className="font-semibold text-slate-700">घर के लिए</a>
                <a href="/kabadi" className="font-semibold text-slate-700">कबाड़ीवाला पोर्टल</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
